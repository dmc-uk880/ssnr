<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <!-- Background -->
  <rect width="600" height="850" fill="#1a4f4f"/>
  
  <!-- Outer Border -->
  <rect x="20" y="20" width="560" height="810" fill="none" stroke="#f1f0e8" stroke-width="4" rx="12"/>
  <rect x="30" y="30" width="540" height="790" fill="none" stroke="#f1f0e8" stroke-width="1" stroke-dasharray="6,6" rx="8"/>

  <!-- Club Header Header -->
  <text x="300" y="110" font-family="'Oswald', sans-serif, Arial" font-size="32" font-weight="bold" fill="#f1f0e8" text-anchor="middle" letter-spacing="3">
    CHERTSEY SS&amp;NR CLUB
  </text>
  
  <line x1="150" y1="140" x2="450" y2="140" stroke="#f1f0e8" stroke-width="2"/>

  <!-- Central Badge Icon -->
  <g transform="translate(300, 310)">
    <circle r="90" fill="none" stroke="#f1f0e8" stroke-width="3"/>
    <circle r="80" fill="#1a4f4f" stroke="#f1f0e8" stroke-width="1"/>
    
    <!-- Calendar Star / Ticket Icon representation -->
    <path d="M-35,-35 H35 V35 H-35 Z" fill="none" stroke="#f1f0e8" stroke-width="3"/>
    <line x1="-35" y1="-15" x2="35" y2="-15" stroke="#f1f0e8" stroke-width="3"/>
    <circle cx="-15" cy="-25" r="4" fill="#f1f0e8"/>
    <circle cx="15" cy="-25" r="4" fill="#f1f0e8"/>
    
    <!-- Question mark -->
    <text x="0" y="22" font-family="sans-serif" font-size="42" font-weight="bold" fill="#f1f0e8" text-anchor="middle">?</text>
  </g>

  <!-- Event Main Title -->
  <text x="300" y="480" font-family="'Oswald', sans-serif, Arial" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    UPCOMING EVENT
  </text>
  
  <text x="300" y="530" font-family="'Roboto', sans-serif, Arial" font-size="24" fill="#f1f0e8" text-anchor="middle" opacity="0.9">
    DETAILS ANNOUNCED SOON
  </text>

  <line x1="200" y1="580" x2="400" y2="580" stroke="#f1f0e8" stroke-width="1" opacity="0.5"/>

  <!-- Footer Info -->
  <text x="300" y="650" font-family="'Roboto', sans-serif, Arial" font-size="18" fill="#f1f0e8" text-anchor="middle" opacity="0.8">
    Check back here or visit our
  </text>
  <text x="300" y="680" font-family="'Roboto', sans-serif, Arial" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Official Facebook Group
  </text>
  <text x="300" y="710" font-family="'Roboto', sans-serif, Arial" font-size="18" fill="#f1f0e8" text-anchor="middle" opacity="0.8">
    for full entertainment listings.
  </text>

  <!-- Bottom Brand -->
  <text x="300" y="790" font-family="'Oswald', sans-serif, Arial" font-size="16" fill="#f1f0e8" text-anchor="middle" letter-spacing="1" opacity="0.6">
    HERIOT ROAD • CHERTSEY
  </text>
</svg>
